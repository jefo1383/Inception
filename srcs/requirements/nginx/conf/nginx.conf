server {
    # Écoute sur le port 443 en SSL pour l'IPv4 et l'IPv6
    listen 443 ssl;
    listen [::]:443 ssl;

    # Le nom de domaine obligatoire demandé par le sujet
    server_name jfoeller.42.fr;

    # Emplacement des certificats générés par OpenSSL
    ssl_certificate /etc/nginx/ssl/inception.crt;
    ssl_certificate_key /etc/nginx/ssl/inception.key;

    # Protocoles de sécurité stricts (TLS v1.2 et v1.3 uniquement)
    ssl_protocols TLSv1.2 TLSv1.3;

    # Dossier racine où se trouvent les fichiers WordPress et fichiers par défaut
    root /var/www/wordpress;
    index index.php index.html index.htm;

    # Règle par défaut : cherche le fichier demandé, sinon renvoie une erreur 404
    location / {
        try_files $uri $uri/ =404;
    }

    # Configuration cruciale : comment NGINX traite les fichiers PHP
    location ~ \.php$ {
        # Sépare l'URL pour trouver le bon script PHP
        include snippets/fastcgi-php.conf;
        
        # Envoie la requête PHP au conteneur wordpress sur le port 9000
        fastcgi_pass wordpress:9000;
    }
}